name: CI

# Lint + typecheck every brand site and the shared kit on each push/PR.
# (Full `next build` needs live Supabase credentials, so Vercel does that.)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
